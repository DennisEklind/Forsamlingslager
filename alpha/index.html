
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intresseanmälan till Alpha-kursen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 15px;
      color: #333;
    }

    h2 {
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea {
      display: block;
      width: 100%;
      padding: 11px;
      border: 1px solid #bbb;
      border-radius: 5px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #3979b9;
      box-shadow: 0 0 3px #3979b9;
    }

    button {
      padding: 13px 25px;
      background: #3979b9;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #28649e;
    }

    button:disabled {
      background: #999;
      cursor: wait;
    }

    #msg {
      font-weight: bold;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<h2>Intresseanmälan till Alpha-kursen</h2>

<p id="msg"></p>

<form id="anmalanForm">

  <div class="form-group">
    <label for="namn">Namn</label>
    <input type="text" id="namn" required>
  </div>

  <div class="form-group">
    <label for="telefon">Telefon</label>
    <input type="tel" id="telefon" required>
  </div>

  <div class="form-group">
    <label for="email">E-post</label>
    <input type="email" id="email" required>
  </div>

  <div class="form-group">
    <label for="allergier">Allergier/Specialkost</label>
    <textarea id="allergier"></textarea>
  </div>

  <button type="submit" id="submitBtn">Skicka anmälan</button>

</form>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzccdKpEwuB9AuH4UrKYx6oLbZFRgNTSL4r6gkcMwneql0WgdvyjZqHY_WnWpDBqF4obA/exec";

  let submitting = false;
anmalanForm.onsubmit = async (e) => {
  e.preventDefault();

  // Stoppa om en anmälan redan håller på att skickas
  if (submitting) return;

  submitting = true;

  const button = document.getElementById("submitBtn");

  const data = {
    namn: namn.value.trim(),
    telefon: telefon.value.trim(),
    email: email.value.trim(),
    allergier: allergier.value.trim()
  };

  button.disabled = true;
  button.textContent = "Skickar...";
  msg.style.color = "black";
  msg.textContent = "Skickar din anmälan...";

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify(data)
    });

    msg.style.color = "green";
    msg.textContent = "✅ Tack! Din anmälan är skickad.";

    anmalanForm.reset();

  } catch (err) {
    msg.style.color = "red";
    msg.textContent = "❌ Fel vid skickning. Försök igen.";

  } finally {
    submitting = false;
    button.disabled = false;
    button.textContent = "Skicka anmälan";
  }
};
</script>

</body>
</html>
