
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmälan till Alpha-kursen</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 20px auto;
      padding: 10px;
    }

    input, textarea, button {
      width: 100%;
      max-width: 400px;
      padding: 8px;
      margin-top: 4px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 80px;
    }

    #msg {
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>Anmälan till Alpha-kursen</h2>

<p id="msg"></p>

<form id="anmalanForm">

  <label>Namn:<br>
    <input type="text" id="namn" required>
  </label>

  <label>Telefon:<br>
    <input type="tel" id="telefon" required>
  </label>

  <label>E-post:<br>
    <input type="email" id="email" required>
  </label>

  <label>Allergier/Specialkost:<br>
    <textarea id="allergier"></textarea>
  </label>

  <button type="submit">Skicka anmälan</button>

</form>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzccdKpEwuB9AuH4UrKYx6oLbZFRgNTSL4r6gkcMwneql0WgdvyjZqHY_WnWpDBqF4obA/exec";

anmalanForm.onsubmit = async (e) => {
  e.preventDefault();

  const data = {
    namn: namn.value.trim(),
    telefon: telefon.value.trim(),
    email: email.value.trim(),
    allergier: allergier.value.trim()
  };

  msg.style.color = "black";
  msg.textContent = "Skickar...";

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify(data)
    });

    msg.style.color = "green";
    msg.textContent = "✅ Tack! Din anmälan är skickad.";

    anmalanForm.reset();

  } catch (err) {
    msg.style.color = "red";
    msg.textContent = "❌ Fel vid skickning. Försök igen.";
  }
};
</script>

</body>
</html>
